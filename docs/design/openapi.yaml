# Design-time contract for issue #41. See docs/design/api.md.
openapi: 3.1.1
info:
  title: Polyglot Sales Agent API
  version: 0.1.0
  summary: Channel webhook and dashboard API. Design-time contract.
  description: Written by hand in the design phase. From milestone M2 this file is generated from the route schemas. Conventions,
    error codes and the role of each route are explained in docs/design/api.md.
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:3000
  description: Local development
tags:
- name: Operations
- name: Channel webhook
- name: Authentication
- name: Tenant
- name: Users
- name: Business data
- name: Conversations
- name: Handovers
- name: Bookings
- name: Metrics
- name: Contact data
security:
- sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
      - Operations
      summary: Process is running
      x-role: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /readyz:
    get:
      operationId: getReadiness
      tags:
      - Operations
      summary: Process can reach the database
      x-role: public
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /webhooks/whatsapp:
    get:
      operationId: verifyWebhook
      tags:
      - Channel webhook
      summary: Answer the channel's subscription check
      x-role: public
      description: The channel calls this once when the webhook is registered. The token is compared with a configured secret.
      parameters:
      - name: hub.mode
        in: query
        required: true
        schema:
          type: string
      - name: hub.verify_token
        in: query
        required: true
        schema:
          type: string
      - name: hub.challenge
        in: query
        required: true
        schema:
          type: string
      security: []
      responses:
        '200':
          description: The challenge, echoed as plain text.
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          description: The verify token is wrong.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: receiveWebhook
      tags:
      - Channel webhook
      summary: Receive messages and status events
      x-role: public
      description: Verified, stored and queued in one transaction, then acknowledged. Nothing else happens in the request.
        A duplicate event is acknowledged and ignored. An event for an unknown number is acknowledged and stored as metadata
        only.
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
        description: HMAC-SHA256 of the raw request body, as the channel sends it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      security: []
      responses:
        '200':
          description: Stored, or a duplicate.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          description: The signature is missing or wrong. Nothing is stored.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is larger than the limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      tags:
      - Authentication
      summary: Sign in
      x-role: public
      description: Sets the session cookie. The response is the same for a wrong password and an unknown address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          description: The email or password is wrong, or the account is locked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      tags:
      - Authentication
      summary: Sign out
      x-role: agent
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session:
    get:
      operationId: getSession
      tags:
      - Authentication
      summary: The current user, tenant and forgery-protection token
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags:
      - Authentication
      summary: Change your own password
      x-role: agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Changed. Every other session of this user has ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags:
      - Authentication
      summary: Ask for a reset link
      x-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnly'
      security: []
      responses:
        '202':
          description: Always this response, whether or not the address has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags:
      - Authentication
      summary: Set a new password with a reset link
      x-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      security: []
      responses:
        '204':
          description: Password set. Every session of this user has ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '410':
          description: The link is used, expired or unknown.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags:
      - Authentication
      summary: Set a password with an invitation link
      x-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      security: []
      responses:
        '204':
          description: The account is active. Sign in next.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '410':
          description: The link is used, expired or unknown.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/tenant:
    get:
      operationId: getTenant
      tags:
      - Tenant
      summary: The tenant, its settings and whether it is answering
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tenant/settings:
    patch:
      operationId: updateSettings
      tags:
      - Tenant
      summary: Change settings
      x-role: owner
      description: Any subset of settings. A value outside its range saves nothing. Warnings, such as a default language whose
        templates are not approved, do not stop the save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/tenant/channel:
    get:
      operationId: getChannel
      tags:
      - Tenant
      summary: Channel connection status
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: setChannelCredentials
      tags:
      - Tenant
      summary: Enter channel credentials
      x-role: owner
      description: The credentials are checked with the channel before they are stored. They are stored encrypted and never
        returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCredentials'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/tenant/channel/check:
    post:
      operationId: checkChannel
      tags:
      - Tenant
      summary: Check the stored credentials now
      x-role: owner
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tenant/templates:
    get:
      operationId: listTemplates
      tags:
      - Tenant
      summary: Approval status of each template and language
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - Users
      summary: List users
      x-role: owner
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: inviteUser
      tags:
      - Users
      summary: Invite a person by email
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvite'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Invited. A link is emailed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/users/{userId}:
    patch:
      operationId: changeUserRole
      tags:
      - Users
      summary: Change a user's role
      x-role: owner
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRole'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: removeUser
      tags:
      - Users
      summary: Remove a user
      x-role: owner
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Removed. Their sessions have ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/services:
    get:
      operationId: listServices
      tags:
      - Business data
      summary: List services
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createService
      tags:
      - Business data
      summary: Add a service
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/services/{serviceId}:
    patch:
      operationId: updateService
      tags:
      - Business data
      summary: Change a service
      x-role: owner
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: deleteService
      tags:
      - Business data
      summary: Remove a service
      x-role: owner
      parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Deleted, or deactivated if it has bookings.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/opening-hours:
    get:
      operationId: getOpeningHours
      tags:
      - Business data
      summary: Opening hours
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: setOpeningHours
      tags:
      - Business data
      summary: Replace opening hours
      x-role: owner
      description: Saved even if future bookings now fall outside the hours; those bookings are kept and returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHours'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHoursResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/policies:
    get:
      operationId: listPolicies
      tags:
      - Business data
      summary: List policies
      x-role: agent
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPolicy
      tags:
      - Business data
      summary: Add a policy
      x-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
  /api/v1/policies/{policyId}:
    patch:
      operationId: updatePolicy
      tags:
      - Business data
      summary: Change a policy
      x-role: owner
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      operationId: deletePolicy
      tags:
      - Business data
      summary: Remove a policy
      x-role: owner
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Success.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags:
      - Conversations
      summary: List conversations
      x-role: agent
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - handed-over
          - unanswered
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: The next_cursor of the previous page.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    anyOf:
                    - type: string
                    - type: 'null'
                additionalProperties: false
                required:
                - items
                - next_cursor
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags:
