        '422':
          $ref: '#/components/responses/Invalid'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Set at sign-in. Not readable by scripts, HTTPS only, same-site.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The csrf_token of the current session. Required on every request that is not a GET.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: A value the client makes up once per intended action. A repeat with the same key returns the first result.
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Not signed in, or the session has ended.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The role does not allow this, or the forgery-protection token is missing or wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state. The code says how.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Invalid:
      description: A value is outside its allowed range. Each field is named.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          description: A URI naming the problem type.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: A stable code from the table in api.md.
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              allowed:
                type: string
            additionalProperties: false
            required:
            - field
            - message
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      description: An error, in the shape of RFC 9457 problem details.
    SignIn:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 1024
      additionalProperties: false
      required:
      - email
      - password
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant_id:
          type: string
          format: uuid
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - user
      - tenant_id
      - csrf_token
      - expires_at
    TokenPassword:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 1024
      additionalProperties: false
      required:
      - token
      - password
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
      additionalProperties: false
      required:
      - current_password
      - new_password
    EmailOnly:
      type: object
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
      required:
      - email
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - owner
          - agent
        status:
          type: string
          enum:
          - invited
          - active
          - removed
      additionalProperties: false
      required:
      - id
      - email
      - role
      - status
    UserInvite:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - owner
          - agent
      additionalProperties: false
      required:
      - email
      - role
    UserRole:
      type: object
      properties:
        role:
          type: string
          enum:
          - owner
          - agent
      additionalProperties: false
      required:
      - role
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pack:
          type: string
          enum:
          - booking
          - faq-only
        answering:
          type: boolean
        missing:
          type: array
          items:
            type: string
            description: A required setting or check that is not yet satisfied.
        settings:
          $ref: '#/components/schemas/Settings'
      additionalProperties: false
      required:
      - id
      - name
      - pack
      - answering
      - missing
      - settings
    Settings:
      type: object
      properties:
        name:
          type: string
        time_zone:
          type: string
          description: IANA time zone.
        default_language:
          type: string
        template_languages:
          type: array
          items:
            type: string
            enum:
            - ar
            - en
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        support_contact:
          type: string
        notification_email:
          type: string
          format: email
        business_hours:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 is Monday.
              opens:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
              closes:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
            additionalProperties: false
            required:
            - weekday
            - opens
            - closes
        booking_horizon_days:
          type: integer
          minimum: 7
          maximum: 365
        slot_interval_minutes:
          type: integer
          minimum: 5
          maximum: 120
        total_concurrent_bookings:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 50
          - type: 'null'
        minimum_notice_hours:
          type: integer
          minimum: 0
          maximum: 72
        change_cutoff_hours:
          type: integer
          minimum: 0
          maximum: 72
        reminder_lead_hours:
          type: integer
          minimum: 1
          maximum: 72
        quiet_hours:
          anyOf:
          - type: object
            properties:
              start:
                type: string
              end:
                type: string
            additionalProperties: false
            required:
            - start
            - end
          - type: 'null'
        handover_escalation_minutes:
          type: integer
          minimum: 5
          maximum: 240
        message_retention_months:
          type: integer
          minimum: 1
          maximum: 36
      additionalProperties: false
      description: The tenant settings of the glossary. A PATCH may send any subset.
    SettingsResult:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - settings
      - warnings
    ChannelCredentials:
      type: object
      properties:
        phone_number_id:
          type: string
        business_account_id:
          type: string
        access_token:
          type: string
          writeOnly: true
      additionalProperties: false
      required:
      - phone_number_id
      - business_account_id
      - access_token
    ChannelStatus:
      type: object
      properties:
        connected:
          type: boolean
        phone_number_id:
          anyOf:
          - type: string
          - type: 'null'
        token_hint:
          anyOf:
          - type: string
            description: The last four characters only.
          - type: 'null'
        last_checked_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC 3339, in UTC.
          - type: 'null'
        last_error:
          anyOf:
          - type: string
            description: A sanitised code, never the channel's raw message.
          - type: 'null'
      additionalProperties: false
      required:
      - connected
    Template:
      type: object
      properties:
        name:
          type: string
        language:
          type: string
        status:
          type: string
          enum:
          - not-submitted
          - pending
          - approved
          - rejected
          - paused
          - disabled
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - name
      - language
      - status
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price_minor:
          type: integer
          minimum: 0
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - name
      - price_minor
      - duration_minutes
      - capacity
      - active
      - updated_at
    ServiceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price_minor:
          type: integer
          minimum: 0
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        active:
          type: boolean
      additionalProperties: false
      required:
      - name
      - price_minor
      - duration_minutes
      - capacity
    OpeningHours:
      type: object
      properties:
        periods:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 is Monday.
              opens:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
              closes:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
            additionalProperties: false
            required:
            - weekday
            - opens
            - closes
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - periods
    OpeningHoursResult:
      type: object
      properties:
        periods:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 is Monday.
              opens:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
              closes:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
            additionalProperties: false
            required:
            - weekday
            - opens
            - closes
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        affected_bookings:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
      additionalProperties: false
      required:
      - periods
      - affected_bookings
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        updated_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - title
      - body
      - updated_at
    PolicyInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 4000
      additionalProperties: false
      required:
      - title
      - body
    BlockedPeriod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        ends_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - starts_at
      - ends_at
    BlockedPeriodInput:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        ends_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        keep_bookings:
          type: boolean
          description: Must be true to block a period that contains bookings.
      additionalProperties: false
      required:
      - starts_at
      - ends_at
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        profile_name:
          anyOf:
          - type: string
          - type: 'null'
        language:
          anyOf:
          - type: string
          - type: 'null'
        opted_out:
          type: boolean
        consent:
          type: string
          enum:
          - none
          - recorded
      additionalProperties: false
      required:
      - id
      - phone
      - opted_out
      - consent
    ContactSearch:
      type: object
      properties:
        phone:
          type: string
          description: In international format.
      additionalProperties: false
      required:
      - phone
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contact:
          $ref: '#/components/schemas/Contact'
        last_message_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC 3339, in UTC.
          - type: 'null'
        reply_window_open:
          type: boolean
        session_state:
          type: string
          enum:
          - none
          - active
          - handed-over
        handover:
          anyOf:
          - $ref: '#/components/schemas/Handover'
          - type: 'null'
      additionalProperties: false
      required:
      - id
      - contact
      - reply_window_open
      - session_state
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - inbound
          - outbound
        class:
          anyOf:
          - type: string
            enum:
            - assistant-reply
            - system-reply
            - staff-message
            - service-notice
            - business-initiated
          - type: 'null'
        type:
          type: string
          description: text, button, or the unsupported type's name.
        text:
          anyOf:
          - type: string
            description: Untrusted. Render as characters, never as markup.
          - type: 'null'
        status:
          anyOf:
          - type: string
            enum:
            - sent
            - delivered
            - read
            - failed
            - withheld
          - type: 'null'
        status_reason:
          anyOf:
          - type: string
          - type: 'null'
        sent_by_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        created_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - direction
      - type
      - created_at
    StaffMessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      additionalProperties: false
      required:
      - text
    Handover:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - waiting
          - in-progress
          - detached
          - followed-up
          - handed-back
          - answered
          - closed-unanswered
        reasons:
          type: array
          items:
            type: string
            enum:
            - requested
            - repeated-failure
            - sensitive-topic
            - data-request
            - limit
            - unsupported-content
            - late-change
            - provider-failure
            - staff
        held_by_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        overdue:
          type: boolean
        followup_status:
          anyOf:
          - type: string
            enum:
            - available
            - held
            - sent
            - withheld
            - failed
          - type: 'null'
        closed_reason:
          anyOf:
          - type: string
          - type: 'null'
        opened_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - conversation_id
      - state
      - reasons
      - overdue
      - opened_at
    HandoverClose:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      required:
      - reason
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        contact_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        ends_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        state:
          type: string
          enum:
          - booked
          - confirmed
          - cancelled
          - attended
          - missed
        created_via:
          type: string
          enum:
          - chat
          - staff
      additionalProperties: false
      required:
      - id
      - service_id
      - starts_at
      - ends_at
      - state
      - created_via
    BookingInput:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        contact_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      additionalProperties: false
      required:
      - service_id
      - starts_at
    BookingMove:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - starts_at
    BookingOutcome:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - attended
          - missed
      additionalProperties: false
      required:
      - outcome
    Slot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        remaining:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - starts_at
      - remaining
    WithheldMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        purpose:
          type: string
        status:
          type: string
          enum:
          - withheld
          - failed
        reason:
          type: string
        due_at:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
      additionalProperties: false
      required:
      - id
      - purpose
      - status
      - reason
      - due_at
    Metric:
      type: object
      properties:
        value:
          anyOf:
          - type: number
          - type: 'null'
        numerator:
          type: integer
        denominator:
          type: integer
      additionalProperties: false
      required:
      - value
      - numerator
      - denominator
      description: value is null when the denominator is zero; the dashboard then shows "no data".
    Metrics:
      type: object
      properties:
        from:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        to:
          type: string
          format: date-time
          description: RFC 3339, in UTC.
        first_reply_seconds_median:
          anyOf:
          - type: number
          - type: 'null'
        inquiry_to_booking_rate:
          $ref: '#/components/schemas/Metric'
        no_show_rate:
          $ref: '#/components/schemas/Metric'
        appointments_without_outcome:
          type: integer
        handover_rate:
          $ref: '#/components/schemas/Metric'
        unanswered_handovers:
          type: integer
        containment_rate:
          $ref: '#/components/schemas/Metric'
        model_cost_per_session_minor:
          anyOf:
          - type: number
          - type: 'null'
        channel_fees_per_session_minor:
          anyOf:
          - type: number
          - type: 'null'
      additionalProperties: false
      required:
      - from
      - to
      - inquiry_to_booking_rate
      - no_show_rate
      - handover_rate
      - containment_rate
    DeletionRequest:
      type: object
      properties:
        confirm:
          type: boolean
          const: true
      additionalProperties: false
      required:
      - confirm
    Accepted:
      type: object
      properties:
        status:
          type: string
          enum:
          - accepted
      additionalProperties: false
      required:
      - status
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
      additionalProperties: false
      required:
      - status
    WebhookEvent:
      type: object
      additionalProperties: true
      description: The channel's own payload. Its shape is defined by the channel, not here; contract tests use dated, synthetic
        fixtures.
