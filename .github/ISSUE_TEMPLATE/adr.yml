name: ADR proposal
description: A decision that changes the architecture, the data model or a dependency
labels: ["phase:design"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The problem and the forces at play.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision and consequences
