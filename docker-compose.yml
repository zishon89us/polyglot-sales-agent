# Local development only. The password below is for a database that listens
# on this machine alone; never reuse it anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      # The application's database. The tests make their own beside it.
      POSTGRES_DB: psa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
